title: PowerShell Encoded Command
id: af6f6cc6-698f-4439-a1f7-7ab12218cd7c
status: experimental
description: Detects powershell.exe started with an encoded (Base64) command via -e, -ec, -enc or -EncodedCommand. Mirrors Wazuh rule 100101.
author: 0x8R41NR07
date: 2026-11-03
tags:
  - attack.execution
  - attack.t1059.001
logsource:
  product: windows
  category: process_creation
detection:
  selection_img:
    Image|endswith: '\powershell.exe'
  selection_flag:
    CommandLine|contains:
      - ' -e '
      - ' -ec '
      - ' -enc '
      - ' -encodedcommand '
  condition: all of selection_*
falsepositives:
  - Admin or deployment scripts that pass encoded commands on purpose
level: high
